name: FPBCraft Diorama NeoForge build

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches:
      - feat/upstream-feature-sync-20261112
      - feat/diorama-jar-managed-history
      - feat/web-map-vehicle-parity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neoforge-1211:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check web projection and HTTP security
        run: |
          node --test tests/web/*.test.mjs
          node scripts/test-web-server.mjs
          node scripts/test-web-terrain.mjs
          node scripts/test-web-vehicles.mjs
          node scripts/test-web-tracks.mjs
          node scripts/test-web-tiles.mjs
          node scripts/test-web-fog.mjs
      - name: Build Diorama (NeoForge 1.21.1)
        run: ./gradlew :1.21.1-neoforge:build --stacktrace
      - name: Check material-slot model rendering
        run: node scripts/test-material-models.mjs
      - name: Check public waypoint ownership and native pins
        run: node scripts/test-web-markers.mjs
      - name: Compile FPBCraft companion addon
        run: ./gradlew -p addons/fpbcraft-map-addon build --stacktrace
