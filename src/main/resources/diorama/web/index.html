<!doctype html>
<html lang="en" data-viewer="diorama">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diorama web map</title>
<style>
	:root {
		--bg: #15171c;
        --map-top: max(12px, env(safe-area-inset-top));
        --map-control-height: 44px;
		--panel: rgba(17, 26, 34, 0.94);
        --map-radius: 10px;
        --map-bottom: max(12px, env(safe-area-inset-bottom));
        --map-shadow: 0 4px 18px #0004;
		--text: #e8eaee;
		--muted: #a3a9b4;
		--line: rgba(255, 255, 255, 0.20);
	}
	html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
		font: 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
	canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
	#map { touch-action: none; cursor: grab; }
	#map.dragging { cursor: grabbing; }
	.bar { position: fixed; top: var(--map-top); left: 12px; right: 12px; display: flex; gap: 8px; pointer-events: none; flex-wrap: wrap; }
	.bar > * { pointer-events: auto; }
	.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--map-radius); box-shadow:var(--map-shadow);backdrop-filter: blur(6px); }
	.zoom { position: fixed; right: 12px; bottom: var(--map-bottom); display: flex; flex-direction: column; overflow: hidden; }
	button { appearance: none; background: none; border: 0; color: var(--text); font: inherit; cursor: pointer; }
	.zoom button { width: 44px; height: 44px; font-size: 20px; }
	.zoom button + button { border-top: 1px solid var(--line); }
	.dims { display: flex; overflow: hidden; }
	.dims button { min-height:calc(var(--map-control-height) - 2px);padding: 8px 14px; color: var(--muted); }
	.dims button.on { color: var(--text); background: rgba(255, 255, 255, 0.08); }
	.dims button + button { border-left: 1px solid var(--line); }
	.follow { padding: 8px 12px; color: var(--muted); }
	.follow.on { color: var(--text); background: rgba(255, 255, 255, 0.08); }
	.where { position: fixed; left: 64px; bottom: var(--map-bottom);box-sizing:border-box;height:44px;max-width:calc(100vw - 260px);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding: 12px 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
	.map-empty { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #334155; padding: 24px; text-align: center; }
	button:focus-visible { outline: 2px solid #7aa7ff; outline-offset: -2px; }
    .map-tools {position:fixed;top:var(--map-top);right:12px;display:flex;align-items:start;gap:8px;z-index:60;}
    .map-icon-button {display:grid;place-items:center;box-sizing:border-box;width:44px;height:var(--map-control-height);color:var(--text);cursor:pointer;list-style:none;}
    .map-icon-button::-webkit-details-marker{display:none;}
    .map-menu[open]>.map-icon-button{border-color:#91d1c0;box-shadow:0 0 0 1px #91d1c066;}
    .map-menu-body{position:absolute;right:0;top:calc(var(--map-control-height) + 10px);width:min(320px,calc(100vw - 24px));box-sizing:border-box;padding:18px;max-height:calc(100dvh - 150px);overflow:auto;background:var(--panel);box-shadow:var(--map-shadow);}
    .map-menu-body>strong{display:block;font-size:18px;}.map-menu-body>small{display:block;color:var(--muted);margin:4px 0 12px;}
    .map-menu-body label{display:flex;align-items:center;gap:12px;min-height:58px;border-top:1px solid var(--line);cursor:pointer;}
    .map-setting-icon{display:grid;place-items:center;width:36px;height:36px;background:#ffffff0b;border:1px solid var(--line);border-radius:8px;flex:none;}
    .map-menu-body input[role=switch]{appearance:none;flex:none;margin-left:auto;width:38px;height:23px;border-radius:20px;background:#626d77;position:relative;cursor:pointer;}
    .map-menu-body input[role=switch]:before{content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:white;transition:transform .14s;}
    .map-menu-body input[role=switch]:checked{background:#39ad83;}.map-menu-body input[role=switch]:checked:before{transform:translateX(15px);}
    .map-menu-body input:focus-visible,.map-icon-button:focus-visible{outline:2px solid #a1e5cf;outline-offset:3px;}
    .map-update{position:fixed;right:68px;bottom:calc(var(--map-bottom) + 54px);padding:5px 8px;color:var(--muted);font-size:11px;pointer-events:auto;}
    @media(max-width:760px){.map-tools{top:calc(var(--map-top) + 54px);}.map-update{right:68px;}}
    button:hover,.map-icon-button:hover{background-color:#ffffff0c;}
    @media(prefers-reduced-motion:reduce){.map-menu-body input[role=switch]:before{transition:none;}}
</style>
</head>
<body>
<canvas id="map" aria-label="Map"></canvas>
<canvas id="fog" aria-hidden="true" style="pointer-events:none"></canvas>
<div id="overlays" style="position:fixed;inset:0;pointer-events:none"></div>
<div class="bar"><div class="dims panel" id="dims"></div><button class="follow panel on" id="follow" hidden aria-pressed="true" title="Keep the map centred on you. Turns off when you move the map.">Follow</button></div>
<div id="map-tools" class="map-tools"></div>
<time id="map-update" class="map-update panel" hidden></time>
<div class="zoom panel"><button id="in" aria-label="Zoom in">+</button><button id="out" aria-label="Zoom out">&minus;</button></div>
<div class="where panel" id="where" hidden></div>
<div class="map-empty" id="empty"></div>
<script type="module">
import { WebQueue } from "./web-queue.js";
import { MapControls } from "./map-controls.js";
import { WebMarkers } from "./web-markers.js";
import { coverageSources } from "./fog-coverage.js";
import { WebFog } from "./web-fog.js";
import { createOverlayApi, projectWorld } from "./overlay-api.js";
"use strict";
// Behind a proxy at a folder of its own (example.com/map), the page's files are inside that folder.
if (!location.pathname.endsWith("/") && !/\.[a-z]+$/i.test(location.pathname)) location.replace(location.pathname + "/" + location.search + location.hash);
const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
const fog = new WebFog(document.getElementById("fog"));
let map = null;          // map.json
let dim = null;          // the dimension shown
let lossless = new Set();
let present = [];        // per zoom, a Map of "u,v" -> the tile's version
// The view: the map point at the middle of the screen, in map units (a block across), and how many CSS pixels a unit takes.
let view = { u: 0, v: 0, scale: 1 };
// The player's own map, served by their game (map.live): where they are, and whether the view stays on them.
let player = null;       // player.json, or null when the game isn't in a world
let follow = true;

const extensionApi = createOverlayApi({
  container: document.getElementById("overlays"),
  getState: () => map && dim ? ({ dimension: dim.id, dimensions: map.dimensions.map(d => d.id),
    u: view.u, v: view.v, scale: view.scale, width: canvas.clientWidth, height: canvas.clientHeight,
    pixelRatio: devicePixelRatio || 1, projection: { sin: map.sin, cos: map.cos, facing: map.facing || 0 } }) : null,
  setDimension: id => {
    const next = map?.dimensions.find(d => d.id === id);
    if (!next) return false;
    if (dim?.id !== id) { pick(next, false); buildDims(); saveHash(); }
    return true;
  },
  queueFeed:()=>map?.queueFeed?new URL(map.queueFeed,location.href).href:undefined,
  vehicleFeed: () => map?.vehicleFeed ? new URL(map.vehicleFeed, location.href).href : undefined,
  depthTiles: () => {
    if (!map?.depth || !dim) return [];
    const width = canvas.clientWidth / view.scale, height = canvas.clientHeight / view.scale;
    if ((Math.ceil(width / map.tileUnits) + 1) * (Math.ceil(height / map.tileUnits) + 1) > 64) return [];
    const out = [];
    for (const [u, v] of visible(0, view.u - width / 2, view.v - height / 2, canvas.clientWidth, canvas.clientHeight).slice(0, 64)) {
      const ver = present[0].get(u + "," + v);
      out.push({ u, v, units: map.tileUnits, pixels: map.tilePixels,
        url: new URL(dim.folder + "/0/" + u + "_" + v + ".depth?v=" + ver, document.baseURI).href });
    }
    return out;
  },
  navigate: point => {
    if (point.dimension && !extensionApi.setDimension(point.dimension)) return false;
    if (!map || ![point.x, point.y, point.z].every(Number.isFinite)) return false;
    const projected = projectWorld(point, map);
    view.u = projected.u; view.v = projected.v;
    setFollow(false); draw(); saveHash(); return true;
  },
});
const controls=new MapControls(extensionApi);
const queueOverlay=new WebQueue(extensionApi);
extensionApi.events.addEventListener('visibility',()=>draw());
const publicMarkers=new WebMarkers(extensionApi,()=>map?.markerFeed);
window.diorama = extensionApi;
window.dispatchEvent(new Event("diorama:ready"));
addEventListener("pagehide", () => { publicMarkers.dispose();controls.dispose();queueOverlay.dispose(); fog.dispose(); extensionApi.dispose(); }, { once: true });

function tileUnits(z) { return map.tileUnits * (1 << z); }

function load(first) {
	fetch("map.json", { cache: "no-cache" }).then(r => r.json()).then(json => {
		const wasLive = map && map.live;
		map = json;
		const wanted = dim ? dim.id : (parseHash().dim || "minecraft:overworld");
		pick(map.dimensions.find(d => d.id === wanted) || map.dimensions[0], first);
		buildDims();
		if (map.live && !wasLive) startPlayer();
	}).catch(() => {}).finally(() => { clearTimeout(loadTimer); loadTimer = setTimeout(() => load(false), map && map.live ? 3000 : 30000); });
}
let loadTimer = 0;

// The player's place, asked for a few times a second while the page shows.
function startPlayer() {
	document.getElementById("follow").hidden = false;
	const ask = () => {
		if (document.hidden) { setTimeout(ask, 500); return; }
		fetch("player.json", { cache: "no-store" }).then(r => r.json()).then(json => {
			const was = player;
			player = json.dimension ? json : null;
			// Through a portal, or into a world: the map is another one now.
			if (player && (!dim || dim.id !== player.dimension)) { clearTimeout(loadTimer); load(false); }
			if (player && follow && dim && dim.id === player.dimension) { view.u = player.u; view.v = player.v; }
			if (player && follow) showPlayerWhere();
			if (player || was) draw();
		}).catch(() => { if (player) { player = null; draw(); } }).finally(() => setTimeout(ask, 250));
	};
	ask();
}
function setFollow(on) {
	follow = on;
	const b = document.getElementById("follow");
	b.classList.toggle("on", on);
	b.setAttribute("aria-pressed", on ? "true" : "false");
	if (on && player && dim && dim.id === player.dimension) { view.u = player.u; view.v = player.v; showPlayerWhere(); draw(); }
}
document.getElementById("follow").onclick = () => setFollow(!follow);
function showPlayerWhere() {
	const where = document.getElementById("where");
	where.hidden = false;
	where.textContent = "X " + Math.floor(player.x) + "   Y " + Math.floor(player.y) + "   Z " + Math.floor(player.z);
}

function pick(d, first) {
    const updated=document.getElementById('map-update');
    updated.hidden=!Number.isFinite(map.updated);
    if(!updated.hidden){const date=new Date(map.updated);updated.dateTime=date.toISOString();updated.textContent='Map updated '+date.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});updated.title='Latest map publication: '+date.toLocaleString();}

	const switched = !dim || !d || dim.id !== d.id;
	dim = d || null;
	lossless=new Set((dim?.losslessTiles||[]).map(([u,v])=>u+","+v));
	// Each tile with its version (when it was last drawn), so a browser keeps a picture until it changes.
	present = dim ? dim.tiles.map(list => {
		const m = new Map();
		const step = dim.versions ? 3 : 2;
		for (let i = 0; i < list.length; i += step) m.set(list[i] + "," + list[i + 1], step === 3 ? list[i + 2] : map.updated);
		return m;
	}) : [];
	const empty = document.getElementById("empty");
	empty.style.display = dim && present[0] && present[0].size ? "none" : "flex";
	empty.textContent = !map.live ? "The map is still being drawn. It fills in as the server draws it."
		: dim ? "Nothing is mapped here yet. The map fills in as you explore." : "No map to show right now. It appears here while you're in a world with a map.";
	if (first || switched) home(first);
	draw();
}

function home(first) {
	const h = first ? parseHash() : {};
	// The world is 60 million blocks across; a view past that is a broken link.
	if (h.u !== undefined && isFinite(h.u) && isFinite(h.v) && isFinite(h.scale) && h.scale > 0 && Math.abs(h.u) < 1e8 && Math.abs(h.v) < 1e8) {
		const lim = limits();
		view = { u: h.u, v: h.v, scale: Math.max(lim.min, Math.min(lim.max, h.scale)) };
		return;
	}
	// Start where most of the land is: the median drawn tile, which a few far-off places (a trip to
	// the world border) can't pull away the way they pull an average.
	const us = [], vs = [];
	if (present[0]) for (const k of present[0].keys()) { const [u, v] = k.split(",").map(Number); us.push(u); vs.push(v); }
	const median = list => { list.sort((a, b) => a - b); return list[list.length >> 1]; };
	view.u = us.length ? (median(us) + 0.5) * map.tileUnits : 0;
	view.v = vs.length ? (median(vs) + 0.5) * map.tileUnits : 0;
	// The player's own map starts closer in: it's for where they are, not for the whole world.
	view.scale = map.live ? 2 : 1;
}

function buildDims() {
	const box = document.getElementById("dims");
	box.innerHTML = "";
	box.style.display = map.dimensions.length > 1 ? "flex" : "none";
	for (const d of map.dimensions) {
		const b = document.createElement("button");
		b.textContent = nameOf(d.id);
		b.className = dim && d.id === dim.id ? "on" : "";
		b.onclick = () => { pick(d, false); buildDims(); saveHash(); };
		box.appendChild(b);
	}
}

function nameOf(id) {
	const known = { "minecraft:overworld": "Overworld", "minecraft:the_nether": "Nether", "minecraft:the_end": "End" };
	if (known[id]) return known[id];
	const path = id.split(":").pop().replace(/_/g, " ");
	return path.charAt(0).toUpperCase() + path.slice(1);
}

function zoomFor(scale) {
	// The coarsest level at least as sharp as the screen: a picture's pixel never covers more than
	// one screen pixel, so a picture is only ever shrunk (to half at most, short of the farthest
	// zoom), never stretched, until the view is closer in than the map's own pixels.
	const native = map.tilePixels / map.tileUnits; // CSS px per unit at zoom 0, 1:1
	let z = Math.floor(Math.log2(native / (scale * (devicePixelRatio || 1))) + 1e-9);
	return Math.max(0, Math.min(dim.zoomLevels - 1, z));
}

// Tiles: fetched a few at a time, the ones the view needs most first, and fetched again if they
// fail. A browser opening a page asks for every picture at once; on a slow link that queues the
// ones in the middle of the screen behind ones it has already panned away from.
const MAX_LOADING = 6;
// key "z/u_v" -> { img, state: "loading" | "ready" | "failed", retry, tries, ver, old }:
// old is the picture from before a redraw, shown until the new one is ready.
const tiles = new Map();
let loading = 0;
let wantedList = [];      // keys of the tiles the view wants, most wanted first, as of the last paint

function tileKey(z, u, v) { return dim.folder + "/" + z + "/" + u + "_" + v; }

function tile(z, u, v) {
	const t = tiles.get(tileKey(z, u, v));
	return !t ? null : t.state === "ready" ? t.img : t.old || null;
}

function startLoads() {
	const now = performance.now();
	const wanted = new Set(wantedList);
	// Pictures no longer on screen stop downloading, so the ones now wanted go first.
	for (const [key, t] of tiles) {
		if (t.state === "loading" && !wanted.has(key)) {
			t.img.onload = t.img.onerror = null;
			t.img.src = "";
			loading--;
			tiles.delete(key);
		}
	}
	for (const key of wantedList) {
		if (loading >= MAX_LOADING) break;
		const parts = key.split("/"), z = parts[parts.length - 2];
		const [u, v] = parts[parts.length - 1].split("_");
		const ver = present[+z] && present[+z].get(u + "," + v);
		let t = tiles.get(key);
		// Already here and current, on its way, or waiting to try again. A picture the server has
		// drawn again since (a newer version in map.json) is fetched again, the old one shown meanwhile.
		if (t && (t.state === "loading" || (t.state === "failed" && t.retry > now) || (t.state === "ready" && t.ver === ver))) continue;
		const img = new Image();
		const old = !t ? null : t.state === "ready" ? t.img : t.old;
		t = { img, state: "loading", tries: t && t.state === "failed" ? t.tries : 0, ver, old };
		tiles.set(key, t);
		loading++;
		img.onload = () => { loading--; t.state = "ready"; t.old = null; draw(); };
		img.onerror = () => {
			// A server or proxy too busy for a moment: again shortly, later and later.
			t.state = "failed"; loading--; t.tries++;
			t.retry = performance.now() + Math.min(30000, 500 * Math.pow(2, t.tries));
			setTimeout(draw, Math.min(30000, 500 * Math.pow(2, t.tries)) + 10);
			draw();
		};
		img.src = key + (+z===0&&lossless.has(u+","+v)?".png?v=":".jpg?v=") + ver;
	}
	// Keep memory in hand: forget ready pictures far from anything wanted once there are many.
	if (tiles.size > 600) {
		for (const [key, t] of tiles) {
			if (tiles.size <= 400) break;
			if (t.state !== "loading" && !wanted.has(key)) tiles.delete(key);
		}
	}
}

let pending = false;
function draw() {
	extensionApi.changed();
	if (pending) return;
	pending = true;
	requestAnimationFrame(() => { pending = false; paint(); });
}

/** The tiles at a level that touch the view, nearest its middle first. */
function visible(level, left, top, w, h) {
	const units = tileUnits(level);
	const u0 = Math.floor(left / units), u1 = Math.floor((left + w / view.scale) / units);
	const v0 = Math.floor(top / units), v1 = Math.floor((top + h / view.scale) / units);
	const cu = (view.u / units) - 0.5, cv = (view.v / units) - 0.5;
	const out = [];
	for (let v = v0; v <= v1; v++) for (let u = u0; u <= u1; u++) {
		if (present[level] && present[level].has(u + "," + v)) out.push([u, v, (u - cu) * (u - cu) + (v - cv) * (v - cv)]);
	}
	out.sort((a, b) => a[2] - b[2]);
	return out;
}

let fillState = { wanted: 0, loaded: 0, any: 0 };
window.__fill = () => fillState;

function paint() {
	const w = canvas.clientWidth, h = canvas.clientHeight, dpr = devicePixelRatio || 1;
	if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
		canvas.width = Math.round(w * dpr);
		canvas.height = Math.round(h * dpr);
	}
	ctx.setTransform(1, 0, 0, 1, 0, 0);
	ctx.fillStyle = map ? map.background : "#15171c";
	ctx.fillRect(0, 0, canvas.width, canvas.height);
	if (!map || !dim) {
		fog.update({u:0,v:0,scale:1,width:w,height:h,dpr,dimension:"",enabled:false,coverage:false,rounded:true,smoke:false},[]);
		return;
	}
	const z = zoomFor(view.scale);
	const left = view.u - w / 2 / view.scale, top = view.v - h / 2 / view.scale;
	// Two levels coarser first: a handful of pictures fill the screen at once, blurred, while the
	// sharp ones come in from the middle out. Then the next view out of the screen's edges, last.
	const coarse = Math.min(dim.zoomLevels - 1, z + 2);
	const sharp = visible(z, left, top, w, h);
	const list = [];
	if (coarse > z) for (const [u, v] of visible(coarse, left, top, w, h)) list.push(tileKey(coarse, u, v));
	for (const [u, v] of sharp) list.push(tileKey(z, u, v));
	const margin = tileUnits(z) * view.scale;
	for (const [u, v] of visible(z, left - margin / view.scale, top - margin / view.scale, w + 2 * margin, h + 2 * margin)) {
		const key = tileKey(z, u, v);
		if (!list.includes(key)) list.push(key);
	}
	wantedList = list;
	startLoads();

	// Each picture from one whole screen pixel to another, a picture's edge where its neighbour's
	// starts: an edge part-way across a pixel is drawn half see-through, and what's under it shows
	// as a thin line between the pictures.
	const k = view.scale * dpr;
	const sx = m => Math.round((m - left) * k), sy = m => Math.round((m - top) * k);
	// Reproject cached terrain from other LODs while the requested JPEGs load.
	const complete=sharp.every(([u,v])=>!!tile(z,u,v));
	const cached=[];
	for(const [key,entry]of complete?[]:tiles){
		if(!key.startsWith(dim.folder+"/"))continue;
		const parts=key.split("/"),level=Number(parts.at(-2));
		if(level>=z&&level<=coarse)continue;
		const [u,v]=parts.at(-1).split("_").map(Number),image=entry.state==="ready"?entry.img:entry.old;
		if(image&&present[level]?.has(u+","+v))cached.push({level,u,v,image});
	}
	cached.sort((a,b)=>b.level-a.level);
	for(const {level,u,v,image}of cached){
		const units=tileUnits(level),x0=sx(u*units),x1=sx((u+1)*units),y0=sy(v*units),y1=sy((v+1)*units);
		if(x1<=0||y1<=0||x0>=canvas.width||y0>=canvas.height)continue;
		ctx.imageSmoothingEnabled=k<map.tilePixels/map.tileUnits/(1<<level);ctx.drawImage(image,x0,y0,x1-x0,y1-y0);
	}
	let loaded = 0, any = 0;
	for (let level = complete?z:coarse; level >= z; level--) {
		const units = tileUnits(level);
		// Shrunk pictures averaged with the browser's best filter; stretched ones (closer in than the
		// map's pixels, or a zoomed-out stand-in while the sharp one loads) keep their pixels square.
		ctx.imageSmoothingEnabled = k < map.tilePixels / map.tileUnits / (1 << level);
		ctx.imageSmoothingQuality = "high";
		for (const [u, v] of level === z ? sharp : visible(level, left, top, w, h)) {
			const img = tile(level, u, v);
			if (!img) continue;
			any++;
			if (level === z) loaded++;
			const x0 = sx(u * units), x1 = sx((u + 1) * units), y0 = sy(v * units), y1 = sy((v + 1) * units);
			ctx.drawImage(img, x0, y0, x1 - x0, y1 - y0);
		}
	}
	fillState = { wanted: sharp.length, loaded, any };
	fog.update({...view,width:w,height:h,dpr,dimension:dim.id,coverage:map.fogCoverage===true,
    enabled:dim.fog!=="none" && extensionApi.visible("clouds"),rounded:map.roundedFog!==false,smoke:dim.fog==="smoke" || dim.id==="minecraft:the_nether",
    validCoverage:source=>source.dimension!==dim.id || present[source.zoom]?.get(source.key)===source.version},
    layout=>coverageSources(present,layout,(z,u,v,extension,version)=>tileKey(z,u,v)+extension+"?v="+version,map.tileUnits,dim.id));
	if (player && player.dimension === dim.id) drawPlayer(sx(player.u), sy(player.v), dpr);
}

// The player's arrow, as the map in the game draws it: pointing where they look, in their colour.
function drawPlayer(x, y, dpr) {
	ctx.save();
	ctx.translate(x, y);
	ctx.rotate(player.heading);
	ctx.scale(dpr, dpr);
	ctx.beginPath();
	ctx.moveTo(11, 0);
	ctx.lineTo(-8, 8);
	ctx.lineTo(-4, 0);
	ctx.lineTo(-8, -8);
	ctx.closePath();
	ctx.lineJoin = "round";
	ctx.lineWidth = 4;
	ctx.strokeStyle = "rgba(0, 0, 0, 0.75)";
	ctx.stroke();
	ctx.fillStyle = player.color || "#3fa9f5";
	ctx.fill();
	ctx.lineWidth = 1.25;
	ctx.strokeStyle = "#ffffff";
	ctx.stroke();
	ctx.restore();
}

// Panning and zooming, by mouse, wheel, touch and keys.
const pointers = new Map();
let last = null;
canvas.addEventListener("pointerdown", e => { extensionApi.changed("interaction"); canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, e); canvas.classList.add("dragging"); last = gesture(); });
canvas.addEventListener("pointermove", e => {
	extensionApi.pointer(e);
	showWhere(e);
	if (!pointers.has(e.pointerId)) return;
	pointers.set(e.pointerId, e);
	const now = gesture();
	if (last && now && last.n === now.n) {
		if (now.n > 1) zoomAt(now.x, now.y, now.d / last.d);
		view.u -= (now.x - last.x) / view.scale;
		view.v -= (now.y - last.y) / view.scale;
		if (follow && map && map.live && (now.x !== last.x || now.y !== last.y)) setFollow(false);
		draw();
	}
	last = now;
});
canvas.addEventListener("pointerleave", e => extensionApi.pointer(e));
for (const type of ["pointerup", "pointercancel"]) canvas.addEventListener(type, e => {
	pointers.delete(e.pointerId);
	last = gesture();
	if (!pointers.size) { canvas.classList.remove("dragging"); saveHash(); }
});
function gesture() {
	const ps = [...pointers.values()];
	if (!ps.length) return null;
	const x = ps.reduce((s, p) => s + p.clientX, 0) / ps.length, y = ps.reduce((s, p) => s + p.clientY, 0) / ps.length;
	const d = ps.length > 1 ? Math.hypot(ps[0].clientX - ps[1].clientX, ps[0].clientY - ps[1].clientY) : 1;
	return { n: ps.length, x, y, d };
}
canvas.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.pow(2, -e.deltaY / (e.deltaMode ? 3 : 300))); draw(); saveHashSoon(); }, { passive: false });
function limits() {
	const native = map ? map.tilePixels / map.tileUnits : 4;
	const coarsest = dim ? dim.zoomLevels - 1 : 0;
	return { min: native / (1 << coarsest) / 4, max: native * 4 };
}
function zoomAt(x, y, factor) {
	const lim = limits();
	const scale = Math.max(lim.min, Math.min(lim.max, view.scale * factor));
	const w = canvas.clientWidth, h = canvas.clientHeight;
	// Following, the view zooms about the player, who stays in the middle.
	if (follow && player && map && map.live) { x = w / 2; y = h / 2; }
	const pu = view.u + (x - w / 2) / view.scale, pv = view.v + (y - h / 2) / view.scale;
	view.scale = scale;
	view.u = pu - (x - w / 2) / scale;
	view.v = pv - (y - h / 2) / scale;
}
document.getElementById("in").onclick = () => { zoomAt(canvas.clientWidth / 2, canvas.clientHeight / 2, 2); draw(); saveHash(); };
document.getElementById("out").onclick = () => { zoomAt(canvas.clientWidth / 2, canvas.clientHeight / 2, 0.5); draw(); saveHash(); };
addEventListener("keydown", e => {
	if (e.target instanceof Element && e.target.closest("input,textarea,select,button,[contenteditable]")) return;
	const step = 80 / view.scale;
	const moves = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
	if (moves[e.key]) { extensionApi.changed("interaction"); view.u += moves[e.key][0]; view.v += moves[e.key][1]; if (follow && map && map.live) setFollow(false); }
	else if (e.key === "+" || e.key === "=") zoomAt(canvas.clientWidth / 2, canvas.clientHeight / 2, 2);
	else if (e.key === "-") zoomAt(canvas.clientWidth / 2, canvas.clientHeight / 2, 0.5);
	else return;
	draw();
	saveHashSoon();
});
addEventListener("resize", draw);

// The block under the pointer. The map looks down at an angle, so a row of the picture runs over
// many places north to south; the Z shown is where it meets the ground at sea level.
function showWhere(e) {
	if (!map || e.pointerType === "touch" || (follow && player)) return;
	const u = view.u + (e.clientX - canvas.clientWidth / 2) / view.scale;
	const v = view.v + (e.clientY - canvas.clientHeight / 2) / view.scale;
	const z = (v + 64 * map.cos) / map.sin;
	// A map the player turned to face another way: back to the world's X and Z.
	const turns = map.facing || 0;
	const wx = turns === 1 ? -z : turns === 2 ? -u : turns === 3 ? z : u;
	const wz = turns === 1 ? u : turns === 2 ? -z : turns === 3 ? -u : z;
	const where = document.getElementById("where");
	where.hidden = false;
	where.textContent = turns % 2 ? "X ~" + Math.floor(wx) + "   Z " + Math.floor(wz) : "X " + Math.floor(wx) + "   Z ~" + Math.floor(wz);
}

// The view in the address, so a link opens on the same place.
function parseHash() {
	const p = new URLSearchParams(location.hash.slice(1));
	const out = { dim: p.get("dim") || undefined };
	if (p.has("u") && p.has("v")) { out.u = +p.get("u"); out.v = +p.get("v"); out.scale = +(p.get("s") || 1); }
	return out;
}
let hashTimer = 0;
function saveHashSoon() { clearTimeout(hashTimer); hashTimer = setTimeout(saveHash, 300); }
function saveHash() {
	// The player's own map opens on the player, not on a place in the address.
	if (!dim || map.live) return;
	history.replaceState(null, "", "#dim=" + encodeURIComponent(dim.id) + "&u=" + Math.round(view.u) + "&v=" + Math.round(view.v) + "&s=" + view.scale.toFixed(3));
}

load(true);
draw();
// Tiny revision polling avoids repeatedly downloading the full tile index. Static proxies work too.
let revision = 0;
const checkUpdates = () => {
  if (document.hidden || map?.live) { setTimeout(checkUpdates, 5000); return; }
  fetch("updates.json", { cache: "no-store" }).then(response => response.ok ? response.json() : null)
    .then(update => { if (update && update.updated !== revision) { revision = update.updated; load(false); } })
    .catch(() => {}).finally(() => setTimeout(checkUpdates, 5000));
};
setTimeout(checkUpdates, 5000);
// Keep the user-managed extensions.json intact. The server provides a second,
// virtual manifest for JAR-backed extensions. Both are optional and deduplicated.
Promise.all(["extensions.json", "extensions.auto.json"].map(async file => {
  try {
    const response = await fetch(file, { cache: "no-store" });
    return response.ok ? await response.json() : null;
  } catch (error) {
    console.warn("Diorama could not read " + file, error);
    return null;
  }
})).then(configs => {
  const loaded = new Set();
  for (const config of configs) {
    if (!config) continue;
    for (const [kind, paths] of [["style", config.styles], ["script", config.scripts]]) {
      if (!Array.isArray(paths)) continue;
      for (const path of paths.slice(0, 16)) {
        if (typeof path !== "string") continue;
        let url;
        try { url = new URL(path, document.baseURI); }
        catch { continue; }
        if (url.origin !== location.origin || !["http:", "https:"].includes(url.protocol)) continue;
        const key = kind + ":" + url.href;
        if (loaded.has(key)) continue;
        loaded.add(key);
        const element = document.createElement(kind === "style" ? "link" : "script");
        if (kind === "style") { element.rel = "stylesheet"; element.href = url.href; }
        else { element.type = "module"; element.src = url.href; }
        document.head.append(element);
      }
    }
  }
}).catch(error => console.warn("Diorama extension initialization failed", error));
</script>
</body>
</html>
