plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'dev.fpbcraft.diorama'
version = '0.1.0'
base.archivesName = 'fpbcraft-diorama-addon'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.263'
    mods {
        fpbcraftdiorama {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Build the parent Diorama project first. This JAR stays external at runtime.
    compileOnly fileTree(dir: '../../versions/1.21.1-neoforge/build/libs', include: 'diorama-*neoforge-1.21.1*.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
